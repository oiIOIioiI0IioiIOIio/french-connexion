name: 01 - Restructuration & Classification

on:
  workflow_dispatch: # Declenchement manuel via l'onglet Actions

permissions:
  contents: write # Necessaire pour que le workflow puisse commiter les changements

jobs:
  restructure:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperation du code
        uses: actions/checkout@v4

      - name: Configuration Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Installation des dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lancement du script de restructuration
        run: python scripts/01_classify_and_structure.py

      - name: Commit et Push des changements
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: restructuration automatique des fiches"
          git push
