name: 02 - Enrichissement Wikipedia

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configuration Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Enrichir les fiches via Wikipedia
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: "open-mistral-nemo"
        run: python scripts/03_enrich_wikipedia.py

      - name: Commit et Push
        run: |
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "feat: enrichissement des donnees via Wikipedia"
          git push
