name: 04 - Generation de Liens

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linking:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configuration Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Spacy French model
        run: python -m spacy download fr_core_news_lg

      - name: Generer les liens automatiques
        run: python scripts/02_link_entities.py

      - name: Commit et Push
        run: |
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "feat: mise a jour des liens inter-entites"
          git push
