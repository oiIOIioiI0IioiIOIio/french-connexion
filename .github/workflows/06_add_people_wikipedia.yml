name: 06 - Ajouter des personnes via Wikipedia

on:
  workflow_dispatch:
    inputs:
      query:
        description: 'Qui voulez-vous chercher ? (ex: Le Siecle, Bernard Arnault, les ministres actuels)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  add-people:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperation du code
        uses: actions/checkout@v4

      - name: Configuration Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Installation des dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Spacy French model
        run: python -m spacy download fr_core_news_lg

      - name: Configuration Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Recherche et ajout des personnes
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: "open-mistral-nemo"
        run: |
          python scripts/06_add_people_from_wikipedia.py "${{ inputs.query }}"

      - name: Push des changements
        run: |
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "feat: ajout personnes Wikipedia - ${{ inputs.query }}"
          git push
