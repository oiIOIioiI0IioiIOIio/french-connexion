name: 07 - Aggregation sources publiques

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Source de donnees'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - wikidata
          - assemblee
          - senat
          - rne
      dry_run:
        description: 'Mode test sans creation de fichiers'
        required: false
        default: false
        type: boolean
  schedule:
    # Execution mensuelle le 1er a 6h UTC
    - cron: '0 6 1 * *'

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperation du code
        uses: actions/checkout@v4

      - name: Configuration Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Installation des dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Auto-tests
        run: python scripts/07_aggregate_public_sources.py --test

      - name: Configuration Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Aggregation des donnees publiques
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          python scripts/07_aggregate_public_sources.py --source ${{ inputs.source || 'all' }}

      - name: Push des changements
        run: |
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "feat: aggregation sources publiques - ${{ inputs.source || 'all' }}"
          git push
