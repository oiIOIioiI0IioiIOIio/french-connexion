name: 08 - Normalisation des fiches

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Mode test sans modification de fichiers'
        required: false
        default: false
        type: boolean
      batch_size:
        description: 'Nombre de fichiers par lot (defaut: 500)'
        required: false
        default: '500'
        type: string

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Recuperation du code
        uses: actions/checkout@v4

      - name: Configuration Git
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Configuration Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Installation des dependances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Auto-tests
        run: python scripts/08_normalize_fiches.py --test

      - name: Normalisation des fiches
        env:
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          ARGS="--batch-size ${{ inputs.batch_size || '500' }}"
          if [ "$DRY_RUN" = "1" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/08_normalize_fiches.py $ARGS

      - name: Push des changements
        run: |
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: normalisation des fiches personnes"
          git push
