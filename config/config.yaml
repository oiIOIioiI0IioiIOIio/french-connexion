# Configuration des types d'entités basée sur la structure du dépôt
entity_types:
  Personne:
    folder: "personnes"
    template: "src/templates/personne.yaml"
  Entreprise:
    folder: "companies"
    template: "src/templates/organisation.yaml"
  Institution:
    folder: "institutions"
    template: "src/templates/organisation.yaml"
  Ecole: # J'ai harmonisé la clé (Ecole) pour correspondre aux conventions de nommage, et corrigé l'indentation ci-dessous
    folder: "écoles"
    template: "src/templates/organisation.yaml"
  Media:
    folder: "medias"
    template: "src/templates/organisation.yaml"
  Fondation:
    folder: "think tanks"
    template: "src/templates/organisation.yaml"
  Parti:
    folder: "partis"
    template: "src/templates/organisation.yaml"

# Configuration de l'IA (Mistral AI)
llm:
  model: "open-mistral-nemo"
  temperature: 0.2
  max_tokens: 2048

# Paramètres de linkage (Génération de liens)
linking:
  min_confidence_score: 0.8
  min_entity_name_length: 4  # Longueur minimale pour éviter les faux positifs
  ignore_patterns:
    - "le"
    - "la"
    - "les"
    - "un"
    - "une"
    - "déjà"
    - "france"
    - "paris"
    - "etat"
    - "republique"
    - "europe"
    - "monde"
    - "ancien"
    - "premier"
